<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gentle Hands Kitchen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one recipe card on a kitchen-tile wall; each friendship moment is a step in the recipe */
:root {
  --tile: #d9ece7;
  --grout: #c3ddd6;
  --card: #fffdf6;
  --ink: #23343a;
  --soft: #5b7178;
  --butter: #ffd65c;
  --mint: #2f9e86;
  --tomato: #e0533d;
  --line: #e4e0d2;
  --display: "Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --tile: #17282a; --grout: #1f3436; --card: #24343a; --ink: #f2efe4; --soft: #b6c7c9;
  --butter: #f5c842; --mint: #4cc3a6; --tomato: #ff7a63; --line: #3a4d52; color-scheme: dark } }
:root[data-theme="dark"] {
  --tile: #17282a; --grout: #1f3436; --card: #24343a; --ink: #f2efe4; --soft: #b6c7c9;
  --butter: #f5c842; --mint: #4cc3a6; --tomato: #ff7a63; --line: #3a4d52; color-scheme: dark }

html, body { height: 100%; margin: 0; }
body {
  background-color: var(--tile);
  background-image: linear-gradient(var(--grout) 2px, transparent 2px), linear-gradient(90deg, var(--grout) 2px, transparent 2px);
  background-size: 56px 56px;
  color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
  box-sizing: border-box;
}
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.25rem; letter-spacing: .01em; }
.brand small { display: block; font-family: var(--body); font-weight: 400; font-size: .8rem; color: var(--soft); }
.toprow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.iconbtn { text-decoration: none; border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px;
  padding: 8px 14px; font: 600 .9rem var(--display); cursor: pointer; }
.card { background: var(--card); border-radius: 22px; padding: 22px 20px 24px; border: 2px solid var(--line);
  box-shadow: 0 6px 0 var(--grout); display: flex; flex-direction: column; gap: 16px; }
.step { font: 600 .8rem var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--mint); }
h1, h2 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: clamp(1.9rem, 7vw, 2.4rem); }
h2 { font-size: clamp(1.4rem, 5.5vw, 1.75rem); }
p { margin: 0; }
.say { font-size: 1.15rem; }
.stage { display: flex; justify-content: center; align-items: flex-end; gap: 6px; min-height: 140px; }
.stage svg { width: 128px; height: 128px; max-width: 42%; }
.bounce { animation: bounce .7s ease; }
@keyframes bounce { 0%{transform:translateY(0)} 40%{transform:translateY(-14px)} 100%{transform:translateY(0)} }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 10px; min-height: 130px;
  border: 3px solid var(--line); background: var(--card); color: var(--ink); border-radius: 18px; cursor: pointer;
  font: 600 1.05rem var(--display); text-align: center; justify-content: center; }
.feels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.choice.feel { min-height: 0; padding: 8px 4px; font-size: .95rem; gap: 2px; }
.choice.feel svg { width: 100%; max-width: 72px; height: auto; }
@media (max-width: 420px) { .feels { grid-template-columns: 1fr 1fr; } }
.choice .pic { font-size: 2.6rem; line-height: 1; }
.choice:hover { border-color: var(--mint); }
.btn { border: 0; border-radius: 16px; padding: 16px 20px; font: 700 1.15rem var(--display); cursor: pointer;
  background: var(--butter); color: #3a2c00; box-shadow: 0 4px 0 #c9a12e; }
.btn.alt { background: transparent; color: var(--ink); box-shadow: none; border: 2px solid var(--line); }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #c9a12e; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .btn { flex: 1 1 200px; }
.bowl { display: flex; align-items: center; gap: 10px; background: var(--card); border: 2px dashed var(--line);
  border-radius: 999px; padding: 8px 14px; }
.bowl b { font: 600 .85rem var(--display); color: var(--soft); white-space: nowrap; }
.slots { display: flex; gap: 6px; flex-wrap: wrap; }
.slot { width: 38px; height: 38px; border-radius: 50%; background: var(--tile); display: grid; place-items: center; font-size: 1.3rem; }
.slot.full { background: var(--butter); }
.breathe { width: 150px; height: 150px; border-radius: 50%; background: var(--mint); margin: 6px auto;
  opacity: .85; transform: scale(.55); }
.breathe.go { animation: breathe 6s ease-in-out forwards; }
@keyframes breathe { 0%{transform:scale(.55)} 45%{transform:scale(1)} 55%{transform:scale(1)} 100%{transform:scale(.55)} }
.chant { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.chant li { font: 600 1.25rem var(--display); padding: 8px 12px; border-radius: 12px; }
.chant li.on { background: var(--butter); color: #3a2c00; }
.cuebox { border-radius: 20px; padding: 24px 18px; display: flex; flex-direction: column; gap: 10px; text-align: center; min-height: 190px; justify-content: center; transition: background .3s; }
.cuebox[data-mode="wiggle"] { background: var(--butter); color: #3a2c00; }
.cuebox[data-mode="calm"] { background: var(--tile); color: var(--ink); }
.cuebox[data-mode="gentle"] { background: var(--mint); color: #ffffff; }
.cuebox h2 { font-size: clamp(1.6rem, 7vw, 2.1rem); }
.cuelabel { font: 700 .85rem var(--display); text-transform: uppercase; letter-spacing: .1em; }
.note { font-size: .85rem; color: var(--soft); }
button:focus-visible { outline: 3px solid var(--mint); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .bounce, .breathe.go { animation: none; } .breathe.go { transform: scale(.85); } }
@media (max-width: 380px) { .choices { grid-template-columns: 1fr; } }
.phrase { text-align: center; padding: 14px; border-radius: 16px; background: #eaf3ff; }
.phrase b { display: block; font: 700 1.7rem var(--display); } .phrase span { color: var(--soft); }
</style>
</head>
<body>

<div class="app">
  <div class="top">
    <div class="brand">Gentle Hands Kitchen<small>Cooking up kind ways to play</small></div>
    <div class="toprow"><a class="iconbtn" href="index.html">Back to Noah's Kitchen</a><button class="iconbtn" id="againBtn">🔊 Again</button>
      <button class="iconbtn" id="soundBtn" aria-pressed="true">Sound on</button></div>
  </div>
  <div class="bowl" aria-label="Mixing bowl">
    <b>Friendship cake</b><div class="slots" id="slots"></div>
  </div>
  <main class="card" id="screen" aria-live="polite"></main>
</div>

<script>

  else if (kind === "muffin") body = `<path d="M30 76 h60 l-8 36 h-44z" fill="#e9b0f2"/><path d="M34 80 l4 30 M48 80 l2 30 M60 80 v30 M72 80 l-2 30 M86 80 l-4 30" stroke="#b56cc4" stroke-width="2"/><path d="M20 78 q0 -50 40 -50 q40 0 40 50z" fill="${c}"/>`;
  else body = `<circle cx="60" cy="72" r="38" fill="${c}"/><path d="M26 44 q-6 -24 16 -24 q4 -14 18 -10 q14 -4 18 10 q22 0 16 24z" fill="#ffffff" stroke="#d8d2c4" stroke-width="2"/>`;
  const ey = 66;
  let eyes;
  if (mood === "sad") eyes = `<path d="M40 ${ey} q6 -5 12 0 M68 ${ey} q6 -5 12 0" stroke="#23343a" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  else if (mood === "scared") eyes = `<circle cx="46" cy="${ey}" r="9" fill="#fff"/><circle cx="74" cy="${ey}" r="9" fill="#fff"/><circle cx="46" cy="${ey}" r="4" fill="#23343a"/><circle cx="74" cy="${ey}" r="4" fill="#23343a"/><path d="M38 50 q8 -6 14 -2 M68 48 q6 -4 14 2" stroke="#23343a" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  else if (mood === "mad") eyes = `<circle cx="46" cy="${ey + 2}" r="5" fill="#23343a"/><circle cx="74" cy="${ey + 2}" r="5" fill="#23343a"/><path d="M36 52 l16 8 M84 52 l-16 8" stroke="#23343a" stroke-width="4" stroke-linecap="round"/>`;
  else eyes = `<circle cx="46" cy="${ey}" r="5" fill="#23343a"/><circle cx="74" cy="${ey}" r="5" fill="#23343a"/>`;
  let mouth = "";
  if (mood === "scared") mouth = `<ellipse cx="60" cy="90" rx="7" ry="9" fill="#23343a"/>`;
  else if (mood === "mad") mouth = `<path d="M46 92 q14 -8 28 0" stroke="#23343a" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  else
  if (mood === "happy") mouth = `<path d="M44 82 q16 16 32 0" stroke="#23343a" stroke-width="4" fill="none" stroke-linecap="round"/>`;

  return `<svg viewBox="0 0 120 120" role="img" aria-label="${kind} feeling ${mood}">${body}${cheeks}${eyes}${mouth}</svg>`;
}

    no:"Ouch! Mango only wanted to play. Hitting hurts.", feel:"sad", you:"someone hit you",
    yesFeel:"Look at Mango's face. Mango is laughing because you are both having fun.",
    es:["Juguemos a otra cosa.","Let's play something else."],
    ing:"🍍" }
];
SCENES.forEach(s => { if (!s.pack) s.pack = "play"; });
const ACTS = {
  "Big happy feelings":"Give a grown-up a real high five!",
  "Toy time":"Pretend to roll a ball on the floor. Roll it slow and gentle.",
  "Tag game":"Give a grown-up a soft tag on the shoulder. Say, You're it!",
  "Look at me!":"Tap a grown-up softly on the arm and say, Look!",
  "Stop means stop":"Wiggle and dance! When you hear STOP, freeze with calm hands.",
  "Art table":"Pretend to cut paper. Snip, snip! Now set the scissors down. Calm hands.",
  "Coloring time":"Draw a funny face in the air with your finger!",
  "Sandbox":"Pretend to scoop sand and pat a sand cake. Pat, pat, pat.",
  "Classroom":"Walk in place with slow walking feet. One, two, three, four!",
  "Big hugs":"Ask a grown-up, Can I hug you? If they say yes, give a gentle hug.",
  "Block tower":"Stack your fists one on top of the other, like blocks!",
  "Line up":"Stand still like a statue with calm hands. Count to five.",
  "When it happens to you":"Hold your hand out strong and say, Stop! I don't like that!",
  "Game over":"Take a big breath. Give a thumbs up and say, Good game!",
  "A friend is crying":"Put your hand on your heart and say, Are you okay?",
  "Tickle game":"Hold your hand out strong like a stop sign. Say, Stop! I don't like that!",
  "They did not stop":"Pretend to walk to a grown-up. Say, Teacher, I need help!",
  "Play a different way":"Say, Let's play something else! Then pick a game: chase, catch, or tag."
};
SCENES.forEach(s => { s.act = ACTS[s.title]; });

const CHANT = ["Hands can wave.", "Hands can clap.", "Hands can high five.", "Hands can tap.", "Funny is when we ALL laugh.", "Gentle hands are soft.", "Calm hands rest.", "That's how friends play!"];

let soundOn = true, idx = 0, bowl = [], round = SCENES.filter(s => s.pack === "play");
const screen = document.getElementById("screen");
const slotsEl = document.getElementById("slots");

let speechId = 0; window.__utt = [];
function hush() { speechId++; try { speechSynthesis.cancel(); } catch (e) {} }
// Some phones drop speech that starts right after a cancel, so wait a moment before speaking.
let lastSpoken = "", speechUnlocked = false;
// iPhones and iPads only allow speech after a tap, so speak a silent sound on the first tap to unlock it.
function unlockSpeech() {
  if (speechUnlocked) return; speechUnlocked = true;
  try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
}
["pointerdown", "touchend", "click", "keydown"].forEach(ev => document.addEventListener(ev, unlockSpeech, true));
function speak(text, onEnd, lang) {
  lastSpoken = text;
  const id = ++speechId;
  try { speechSynthesis.cancel(); speechSynthesis.resume(); } catch (e) {}
  setTimeout(() => { if (id === speechId) speakNow(text, onEnd ? () => { if (id === speechId) onEnd(); } : onEnd, lang); }, 180);
}
function speakNow(text, onEnd, lang) {
  try {
    if (!soundOn || !window.speechSynthesis) { if (onEnd) setTimeout(onEnd, 900); return; }
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.88; u.pitch = 1.1; u.lang = lang || "en-US";
    try { const base = u.lang.slice(0, 2).toLowerCase(), vs = speechSynthesis.getVoices().filter(v => v.lang.toLowerCase().replace("_", "-").startsWith(base));
      const v = vs.find(x => x.lang.replace("_", "-").toLowerCase() === u.lang.toLowerCase()) || vs[0]; if (v) u.voice = v; } catch (e) {}
    if (onEnd) u.onend = onEnd;
    window.__utt.push(u); if (window.__utt.length > 20) window.__utt.shift(); speechSynthesis.speak(u);
  } catch (e) { if (onEnd) setTimeout(onEnd, 900); }
}

let actx;
function chime(good) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = good ? [523, 659, 784] : [330, 262];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = f; o.type = "sine";
      g.gain.setValueAtTime(0.0001, actx.currentTime + i * .12);
      g.gain.exponentialRampToValueAtTime(0.2, actx.currentTime + i * .12 + .02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + i * .12 + .35);
      o.connect(g).connect(actx.destination); o.start(actx.currentTime + i * .12); o.stop(actx.currentTime + i * .12 + .4);
    });
  } catch (e) {}
}
function renderBowl() {
  slotsEl.innerHTML = round.map((s, i) => `<span class="slot ${bowl[i] ? "full" : ""}">${bowl[i] ? s.ing : ""}</span>`).join("");
}

function start() {
  hush(); clearTimers(); idx = 0; bowl = []; renderBowl();
  screen.innerHTML = `
    <div class="step">Chef Noah's recipe</div>
    <h1>Let's cook up gentle hands!</h1>
    <div class="stage">${face("chef","excited")}</div>
    <p class="say">Your food friends want to play. Pick the gentle way, and add something yummy to the friendship cake.</p>
    <p class="say"><b>Gentle hands</b> are soft with friends. <b>Calm hands</b> rest and stay still.</p>
    <div class="row">
      <button class="btn" data-pack="school">School day</button>
      <button class="btn" data-pack="play">Play time</button>
      <button class="btn" data-pack="friend">Being a friend</button>
    </div>
    <div class="row">
      <button class="btn" data-pack="touch">When someone touches me</button>
      <button class="btn alt" data-pack="all">All the friends</button>
      <button class="btn alt" id="calm">Squeeze &amp; breathe</button>
      <button class="btn alt" id="wiggle">Wiggle &amp; calm game</button>
    </div>`;
  document.getElementById("wiggle").onclick = wiggleGame;
  screen.querySelectorAll("[data-pack]").forEach(b => b.onclick = () => {
    const p = b.dataset.pack;
    round = p === "all" ? SCENES.slice() : SCENES.filter(s => s.pack === p);
    idx = 0; bowl = []; renderBowl(); scene();
  });
  document.getElementById("calm").onclick = () => breathe(start, "Ready to cook");
}

function scene() {
  hush(); clearTimers();
  const s = round[idx];
  const opts = Math.random() < .5 ? [["good", s.good], ["bad", s.bad]] : [["bad", s.bad], ["good", s.good]];
  screen.innerHTML = `
    <div class="step">Step ${idx + 1} of ${round.length} · ${s.title}</div>
    <div class="stage">${face("chef","excited")}${face(s.friend,"happy")}</div>
    <p class="say">${s.setup}</p>
    <h2>${s.ask}</h2>
    <div class="choices">${opts.map(([k, o]) => `<button class="choice" data-k="${k}"><span class="pic" aria-hidden="true">${o.pic}</span>${o.text}</button>`).join("")}</div>
    <button class="iconbtn" id="again">Hear it again</button>`;
  const read = () => { hush(); speak(s.setup + " " + s.ask + " " + opts[0][1].text.replace(/"/g,"") + "? Or " + opts[1][1].text.replace(/"/g,"") + "?"); };
  read();
  document.getElementById("again").onclick = read;
  screen.querySelectorAll(".choice").forEach(b => b.onclick = () => b.dataset.k === "good" ? yes() : no());
}

function yes() {
  hush(); chime(true);
  const s = round[idx]; bowl[idx] = true; renderBowl();
  screen.innerHTML = `
    <div class="step">Gentle hands!</div>
    <div class="stage bounce">${face("chef","excited")}${face(s.friend,"excited")}</div>
    <h2>${s.yes}</h2>
    <p class="say">${s.yesFeel || s.name + " feels happy. You feel happy too!"} Now ${s.ing} goes in the friendship cake.</p>
    <button class="btn" id="next">Act it out!</button>`;
  speak(s.yes + " " + (s.yesFeel || s.name + " feels happy. You feel happy too!"));
  document.getElementById("next").onclick = act;
}

let timers = [];
function clearTimers() { timers.forEach(clearTimeout); timers = []; }

function act() {
  hush(); clearTimers();
  const s = round[idx];
  const last = idx >= round.length - 1;
  screen.innerHTML = `
    <div class="step">Act it out · Get up and move!</div>
    <div class="stage bounce">${face("chef","excited")}</div>
    <h2 id="actcue">${s.act}</h2>
    ${s.es ? `<div class="phrase"><b>${s.es[0]}</b><span>${s.es[1]}</span><br><button class="btn alt" id="sayes" style="margin-top:8px">🔊 Say it with me</button></div>` : ""}
    <div class="row">
      <button class="btn" id="did">I did it!</button>
      <button class="btn alt" id="hear">Hear it again</button>
    </div>`;
  const go = () => {
    hush(); clearTimers(); speak(s.act);
    if (s.title === "Stop means stop") {
      timers.push(setTimeout(() => { document.getElementById("actcue").textContent = "STOP! Freeze! Calm hands."; speak("STOP! Freeze! Calm hands."); }, 7000));
    }
  };
  go();
  document.getElementById("hear").onclick = go;
  const sayes = document.getElementById("sayes");
  if (sayes) sayes.onclick = () => { hush(); clearTimers(); speak(s.es[0], () => timers.push(setTimeout(() => speak(s.es[1]), 2200)), "es-MX"); };
  document.getElementById("did").onclick = () => { clearTimers(); idx++; last ? finish() : scene(); };
}

const MOVES = [
  ["wiggle","Wiggle your fingers fast!"],
  ["calm","Calm hands! Put your hands in your lap."],
  ["wiggle","Clap, clap, clap!"],
  ["calm","Calm hands! Give yourself a hug."],
  ["wiggle","Jump like popcorn!"],
  ["calm","Calm hands! Hands on your knees. Be still."],
  ["wiggle","Shake your whole body like jello!"],
  ["gentle","Gentle hands! Pat your own arm softly."],
  ["calm","Calm hands! Hands on your tummy. Big breath."]
];
function wiggleGame() {
  hush(); clearTimers();
  screen.innerHTML = `
    <div class="step">Wiggle &amp; calm game</div>
    <div class="cuebox" id="cuebox" data-mode="calm">
      <div class="cuelabel" id="cuelabel">Get ready</div>
      <h2 id="cue">Stand up! Listen and move.</h2>
    </div>
    <div class="row"><button class="btn alt" id="stopgame">Back to the kitchen</button></div>`;
  document.getElementById("stopgame").onclick = () => { clearTimers(); start(); };
  const box = document.getElementById("cuebox"), lab = document.getElementById("cuelabel"), cue = document.getElementById("cue");
  speak("Stand up! Listen and move.");
  let t = 2600;
  MOVES.forEach(([mode, text]) => {
    timers.push(setTimeout(() => {
      box.dataset.mode = mode;
      lab.textContent = mode === "wiggle" ? "Wiggly body" : mode === "gentle" ? "Gentle hands" : "Calm hands";
      cue.textContent = text; hush(); speak(text);
    }, t));
    t += mode === "wiggle" ? 4500 : 5000;
  });
  timers.push(setTimeout(() => {
    box.dataset.mode = "gentle"; lab.textContent = "You did it!";
    cue.textContent = "You can be wiggly. You can be calm. You are the boss of your hands!";
    hush(); speak(cue.textContent); chime(true);
  }, t));
}

function no() {
  hush(); chime(false);
  const s = round[idx];
  screen.innerHTML = `
    <div class="step">Uh oh</div>
    <div class="stage">${face("chef","neutral")}${face(s.friend,s.feel)}</div>
    <h2>${s.no}</h2>
    <button class="btn" id="look">Look at ${s.name}'s face</button>`;
  speak(s.no + " Look at " + s.name + "'s face.");
  document.getElementById("look").onclick = feelQ;
}

const FEELS = [["happy","Happy"],["sad","Sad"],["scared","Scared"],["mad","Mad"]];
function feelGrid(kind) {
  return `<div class="feels">${FEELS.map(([m, l]) => `<button class="choice feel" data-m="${m}">${face(kind, m)}${l}</button>`).join("")}</div>`;
}

function feelQ() {
  hush();
  const s = round[idx];
  screen.innerHTML = `
    <div class="step">Feelings detective</div>
    <div class="stage">${face(s.friend, s.feel)}</div>
    <h2>How does ${s.name} feel?</h2>
    <p class="say" id="hint">Look at the eyes and the mouth.</p>
    ${feelGrid(s.friend)}`;
  speak("How does " + s.name + " feel? Happy? Sad? Scared? Or mad?");
  screen.querySelectorAll(".feel").forEach(b => b.onclick = () => {
    if (b.dataset.m === s.feel) { chime(true); speak("Yes! " + s.name + " feels " + s.feel + ".", funnyQ); }
    else {
      const h = document.getElementById("hint");
      h.textContent = b.dataset.m === "happy" ? `Look again. Is ${s.name} smiling?` : `Look again at ${s.name}'s eyes and mouth.`;
      speak(h.textContent);
    }
  });
}

function funnyQ() {
  hush();
  const s = round[idx];
  screen.innerHTML = `
    <div class="step">Is it funny?</div>
    <div class="stage">${face("chef","excited")}${face(s.friend, s.feel)}</div>
    <h2>Sometimes you laugh. Is ${s.name} laughing?</h2>
    <div class="choices">
      <button class="choice" data-f="yes"><span class="pic" aria-hidden="true">😂</span>Funny</button>
      <button class="choice" data-f="no"><span class="pic" aria-hidden="true">🙅</span>Not funny</button>
    </div>
    <p class="say" id="fmsg">Funny is only funny when everyone laughs.</p>
    <button class="btn" id="fnext" hidden>Next</button>`;
  speak("Sometimes you laugh. Look at " + s.name + ". Is it funny? Or not funny?");
  const msg = document.getElementById("fmsg"), nx = document.getElementById("fnext");
  screen.querySelectorAll("[data-f]").forEach(b => b.onclick = () => {
    if (b.dataset.f === "no") {
      chime(true);
      msg.textContent = `Right, not funny. ${s.name} is not laughing. Funny is only funny when everyone laughs.`;
      nx.hidden = false;
    } else {
      msg.textContent = `Look at ${s.name}. ${s.name} is not laughing. When a friend is hurt, it is not funny.`;
    }
    speak(msg.textContent);
  });
  nx.onclick = youQ;
}

function youQ() {
  hush();
  const s = round[idx];
  screen.innerHTML = `
    <div class="step">What about you?</div>
    <div class="stage">${face("chef","neutral")}</div>
    <h2>What if ${s.you}? How would YOU feel?</h2>
    <p class="say" id="ymsg">Think about your own body and face.</p>
    ${feelGrid("chef")}
    <button class="btn" id="ynext" hidden>Breathe &amp; try again</button>`;
  speak("What if " + s.you + "? How would you feel?");
  const msg = document.getElementById("ymsg"), nx = document.getElementById("ynext");
  screen.querySelectorAll(".feel").forEach(b => b.onclick = () => {
    if (b.dataset.m === "happy") {
      msg.textContent = `Hmm. Would that feel happy? Think about how it would hurt.`;
    } else {
      chime(true);
      msg.textContent = `Yes. You would feel ${b.dataset.m} too. ${s.name} feels ${s.feel} right now. We can say, "Sorry. Are you okay?"`;
      nx.hidden = false;
    }
    speak(msg.textContent.replace(/"/g, ""));
  });
  nx.onclick = () => breathe(scene, "Try again");
}

function breathe(next, label) {
  hush(); clearTimers();
  screen.innerHTML = `
    <div class="step">Calm-down break</div>
    <h2 id="cue">Squeeze your hands tight…</h2>
    <div class="breathe" id="ball" aria-hidden="true"></div>
    <button class="btn" id="done" hidden>${label}</button>`;
  const cue = document.getElementById("cue"), ball = document.getElementById("ball"), done = document.getElementById("done");
  // each phrase finishes before the next one starts
  const pause = (fn) => timers.push(setTimeout(fn, 500));
  speak("Squeeze your hands tight.", () => pause(() => {
    cue.textContent = "Breathe in… like smelling a cookie"; ball.classList.add("go");
    speak("Breathe in, like smelling a cookie.", () => pause(() => {
      cue.textContent = "Blow out… like cooling hot soup";
      speak("Blow out, like cooling hot soup.", () => pause(() => {
        cue.textContent = "Let go. Calm hands."; speak("Let go. Calm hands. Now you are ready."); done.hidden = false; done.focus();
      }));
    }));
  }));
  done.onclick = next;
}

function finish() {
  hush(); chime(true);
  screen.innerHTML = `
    <div class="step">Recipe complete</div>
    <h1>You baked the Friendship Cake!</h1>
    <div class="stage bounce">${face("mango","excited")}${face("chef","excited")}${face("berry","excited")}</div>
    <p class="say">Your friends feel happy and safe. Let's say the gentle hands chant together.</p>
    <ol class="chant" id="chant">${CHANT.map(l => `<li>${l}</li>`).join("")}</ol>
    <div class="row">
      <button class="btn" id="sing">Say it together</button>
      <button class="btn alt" id="replay">Cook again</button>
    </div>
    <p class="note">Grown-ups: say the chant with real moves. Wave, clap, high five, tap, then rest hands in your lap for "calm hands."</p>`;
  speak("Hooray! You baked the friendship cake!");
  document.getElementById("replay").onclick = start;
  document.getElementById("sing").onclick = sing;
}

function sing() {
  hush();
  const items = [...document.querySelectorAll("#chant li")];
  let i = 0;
  const step = () => {
    items.forEach(li => li.classList.remove("on"));
    if (i >= items.length) return;
    items[i].classList.add("on");
    speak(CHANT[i], () => { i++; setTimeout(step, 350); });
  };
  step();
}

document.getElementById("againBtn").onclick = () => { if (lastSpoken) speak(lastSpoken); };
document.getElementById("soundBtn").onclick = (e) => {
  soundOn = !soundOn; if (!soundOn) hush();
  e.currentTarget.textContent = soundOn ? "Sound on" : "Sound off";
  e.currentTarget.setAttribute("aria-pressed", soundOn);
};
start();
</script>

</body>
</html>
